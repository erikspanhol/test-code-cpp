name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run C++ tests
        run: cmake -S . -B build && cmake --build build && ctest --test-dir build --output-on-failure
      - name: Install Lua
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
      - name: Run Lua tests
        run: lua5.4 tests/loot_test.lua
